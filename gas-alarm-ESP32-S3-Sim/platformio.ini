[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = knolleary/PubSubClient@^2.8
; ลบ -DWOKWI_SIM และ -DSIM_SCENARIO ออกตอนจะอัปโหลดลงบอร์ดจริง
; -DSIM_SCENARIO = ให้โค้ดสร้างค่าแก๊สจำลองเอง (ไม่ต้องคลิกเซนเซอร์)
build_flags =
  -DWOKWI_SIM
  -DSIM_SCENARIO
